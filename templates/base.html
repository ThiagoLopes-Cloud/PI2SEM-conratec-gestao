{% load static %}<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Conratec{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="{% static 'css/conratec.css' %}">
</head>
<body>
  <header class="cabecalho">
    <div class="container d-flex flex-wrap align-items-center justify-content-between gap-2 py-3">
      <a class="marca" href="{% url 'painel' %}">Conratec</a>
      <nav aria-label="Navegação principal">
        <ul class="nav">
          <li class="nav-item"><a class="nav-link" href="{% url 'painel' %}">Painel</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container py-4">
    {% block conteudo %}{% endblock %}
  </main>

  <footer class="container py-4">
    <p class="text-secondary mb-0">Conratec - instalação e manutenção de ar-condicionado</p>
  </footer>
</body>
</html>
